[project]
name = "kiro-glue-jobs"
version = "1.0.0"
description = "Kiro Insights pipeline — Glue Python Shell jobs"
requires-python = ">=3.9"
# Runtime deps match what the Glue job environment provides (see
# --additional-python-modules in infra/lib/insights-stack.ts). pandas is
# pre-installed in AWS Glue 3.0 Python Shell; pyarrow is used lazily inside
# the scripts for Parquet IO.
dependencies = [
  "boto3>=1.34",
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
